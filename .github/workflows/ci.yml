name: Data Engineering CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "Ejercicio_1/**"
      - "Ejercicio_3/**"
      - ".github/workflows/ci.yml"

  push:
    branches:
      - main
    paths:
      - "Ejercicio_1/**"
      - "Ejercicio_3/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # EXERCISE 1 - CONTINUOUS INTEGRATION
  # ==========================================================

  exercise_1_ci:
    name: Exercise 1 - Phone Quality Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Run Exercise 1 tests
        run: |
          python -m unittest discover \
            -s Ejercicio_1/test \
            -p "test_*.py" \
            -v


  # ==========================================================
  # EXERCISE 3 - CONTINUOUS INTEGRATION
  # ==========================================================

  exercise_3_ci:
    name: Exercise 3 - Streak Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Install Exercise 3 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Ejercicio_3/requirements.txt

      - name: Run Exercise 3 automated tests
        run: |
          python -m unittest discover \
            -s Ejercicio_3/test \
            -p "test_*.py" \
            -v

      - name: Build Exercise 3 database
        run: |
          python -m Ejercicio_3.src.load_data

      - name: Prepare Exercise 3 data
        run: |
          python -m Ejercicio_3.src.prepare_data

      - name: Smoke test streak query
        run: |
          python -m Ejercicio_3.src.run_query \
            --fecha-base 2024-12-31 \
            --n 3


  # ==========================================================
  # EXERCISE 1 - CONTINUOUS DELIVERY
  # ==========================================================

  exercise_1_cd:
    name: Build trusted phone dataset

    needs:
      - exercise_1_ci
      - exercise_3_ci

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate trusted phone dataset
        run: |
          python -m Ejercicio_1.src.pipeline

      - name: Upload trusted phone dataset
        uses: actions/upload-artifact@v7
        with:
          name: trusted-phone-dataset

          # IMPORTANT:
          # Keep here the exact output path that currently works
          # in your Exercise 1 pipeline.
          path: Ejercicio_1/data/processed_clients.csv

          retention-days: 30
          if-no-files-found: error